<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Schedule Viewer</title>
    <style>
        :root {
            --primary: #1e3a8a; 
            --secondary: #475569; 
            --accent: #3b82f6; 
            --accent-hover: #2563eb; 
            --bg-light: #f8fafc; 
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        #sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: var(--primary);
            color: white;
        }

        .sidebar-header h2 {
            margin: 0 0 15px 0;
            font-size: 1.4em;
        }

        .search-box {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            outline: none;
            box-sizing: border-box;
        }

        .person-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .person-list li {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .person-list li:hover {
            background-color: #f1f5f9;
            padding-left: 25px;
        }

        .person-list li.active {
            background-color: var(--accent);
            color: white;
            font-weight: bold;
            border-left: 4px solid #1d4ed8;
        }

        /* Main Content Styles */
        #main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            display: flex;
            flex-direction: column;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 20px;
        }

        #selectedName {
            margin: 0;
            color: var(--primary);
            font-size: 2em;
        }

        /* Filter Controls Panel */
        .filter-controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 0.8em;
            font-weight: bold;
            color: var(--secondary);
            text-transform: uppercase;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            font-size: 0.9em;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .filter-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .schedule-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-top: 5px solid var(--accent);
            transition: transform 0.2s ease;
        }

        .schedule-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .schedule-card h3 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 1.2em;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            background: #e2e8f0;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            color: var(--secondary);
            margin-right: 8px;
            min-width: 50px;
            text-align: center;
        }

        .schedule-card p {
            margin: 8px 0;
            font-size: 0.95em;
            display: flex;
            align-items: center;
        }

        .empty-state {
            color: var(--secondary);
            font-size: 1.2em;
            text-align: center;
            margin-top: 100px;
            grid-column: 1 / -1;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow: auto;
                height: auto;
            }
            #sidebar {
                width: 100%;
                height: 300px;
                border-right: none;
                border-bottom: 2px solid var(--border);
            }
            #main-content {
                padding: 20px;
                overflow: visible;
            }
            .main-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- Left Sidebar: List of People -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Partners</h2>
            <input type="text" id="teacherSearch" class="search-box" placeholder="Search a name (e.g., Ángel)...">
        </div>
        <ul class="person-list" id="personList">
            <!-- JavaScript will populate this list -->
        </ul>
    </div>

    <!-- Right Panel: Schedule Details & Filters -->
    <div id="main-content">
        <div class="main-header">
            <h2 id="selectedName">All Schedules View</h2>
            
            <!-- Independent Filter Controls -->
            <div class="filter-controls">
                <div class="filter-group">
                    <label for="dayFilter">Filter by Day</label>
                    <select id="dayFilter">
                        <option value="all">All Days</option>
                        <option value="Día-1">Día 1</option>
                        <option value="Día-2">Día 2</option>
                        <option value="Día-3">Día 3</option>
                        <option value="Día-4">Día 4</option>
                        <option value="Día-5">Día 5</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="typeFilter">Schedule Type</label>
                    <select id="typeFilter">
                        <option value="all">All Types</option>
                        <option value="Break">Break</option>
                        <option value="Lunch">Lunch</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="resultsContainer" class="results">
            <!-- Populated dynamically -->
        </div>
    </div>

    <!-- Load external schedule database -->
    <script src="schedule.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const personListEl = document.getElementById('personList');
            const searchInput = document.getElementById('teacherSearch');
            const selectedNameEl = document.getElementById('selectedName');
            const resultsContainer = document.getElementById('resultsContainer');
            const dayFilter = document.getElementById('dayFilter');
            const typeFilter = document.getElementById('typeFilter');

            let currentSelectedPerson = null;

            // 1. Helper function for accent/case insensitive comparison
            function normalizeString(str) {
                if (!str) return "";
                return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
            }

            // 2. Extract unique people from scheduleData (Ignore subjects/placeholders)
            const ignoredNames = new Set(["N.A.", "MATH", "Inglés", "SOCIALES", "Pendiente"]);
            let uniquePeople = [];
            
            if (typeof scheduleData !== 'undefined') {
                const allNames = scheduleData.map(item => item.person);
                uniquePeople = [...new Set(allNames)].filter(name => !ignoredNames.has(name)).sort();
            } else {
                console.error("Error: schedule.js data not loaded.");
            }

            // 3. Render the sidebar list
            function renderSidebar(filterText = "") {
                personListEl.innerHTML = "";
                const query = normalizeString(filterText);
                let matchCount = 0;

                // Add an "All People / Clear Selection" top option in sidebar for flexibility
                const allLi = document.createElement('li');
                allLi.textContent = "👤 View all teachers";
                if (!currentSelectedPerson) allLi.classList.add('active');
                allLi.addEventListener('click', () => {
                    document.querySelectorAll('.person-list li').forEach(el => el.classList.remove('active'));
                    allLi.classList.add('active');
                    currentSelectedPerson = null;
                    renderMainContent();
                });
                personListEl.appendChild(allLi);

                uniquePeople.forEach(person => {
                    if (normalizeString(person).includes(query)) {
                        matchCount++;
                        const li = document.createElement('li');
                        li.textContent = person;
                        
                        if (currentSelectedPerson === person) {
                            li.classList.add('active');
                        }
                        
                        li.addEventListener('click', () => {
                            document.querySelectorAll('.person-list li').forEach(el => el.classList.remove('active'));
                            li.classList.add('active');
                            currentSelectedPerson = person;
                            renderMainContent();
                        });
                        
                        personListEl.appendChild(li);
                    }
                });

                if (matchCount === 0 && query !== "") {
                    const noMatch = document.createElement('li');
                    noMatch.style.cssText = "text-align:center; color:#94a3b8; cursor:default;";
                    noMatch.textContent = "No matches found";
                    personListEl.appendChild(noMatch);
                }
            }

            // 4. Render main content driven independently by any filter combination
            function renderMainContent() {
                resultsContainer.innerHTML = "";

                const selectedDay = dayFilter.value;
                const selectedType = typeFilter.value;

                // Update Header Title based on selection
                if (currentSelectedPerson) {
                    selectedNameEl.textContent = `${currentSelectedPerson}'s Schedule`;
                } else {
                    let titleParts = [];
                    if (selectedType !== 'all') titleParts.push(selectedType);
                    if (selectedDay !== 'all') titleParts.push(selectedDay);
                    selectedNameEl.textContent = titleParts.length > 0 ? `Filtered View (${titleParts.join(' - ')})` : "All Schedules View";
                }

                // Filter database independently across all criteria
                const filteredSchedule = scheduleData.filter(item => {
                    if (ignoredNames.has(item.person)) return false;

                    const matchPerson = !currentSelectedPerson || item.person === currentSelectedPerson;
                    const matchDay = selectedDay === 'all' || item.day === selectedDay;
                    const matchType = selectedType === 'all' || item.type === selectedType;

                    return matchPerson && matchDay && matchType;
                });

                // Sort results chronologically
                filteredSchedule.sort((a, b) => {
                    if (a.person !== b.person) return a.person.localeCompare(b.person);
                    if (a.day !== b.day) return a.day.localeCompare(b.day);
                    return a.type.localeCompare(b.type);
                });

                if (filteredSchedule.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="empty-state">
                            <p>No assignments match the current combination of filters.</p>
                        </div>`;
                    return;
                }

                filteredSchedule.forEach(item => {
                    const zoneDisplay = spaces[item.zone] || "Pendiente/Sin Zona";
                    const card = document.createElement('div');
                    card.className = 'schedule-card';
                    card.innerHTML = `
                        <h3>${item.person}</h3>
                        <p><span class="badge">Day</span> ${item.day}</p>
                        <p><span class="badge">Type</span> ${item.type}</p>
                        <p><span class="badge">Time</span> ${item.time}</p>
                        <p><span class="badge">Zona ${item.zone}</span> ${zoneDisplay}</p>
                        ${item.note ? `<p style="color: #ef4444; font-size: 0.85em; margin-top: 10px;">* ${item.note}</p>` : ""}
                    `;
                    resultsContainer.appendChild(card);
                });
            }

            // 5. Independent Event Listeners
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    renderSidebar(e.target.value);
                });
            }

            if (dayFilter) {
                dayFilter.addEventListener('change', renderMainContent);
            }

            if (typeFilter) {
                typeFilter.addEventListener('change', renderMainContent);
            }

            // 6. Initial Load
            renderSidebar();
            renderMainContent();
        });
    </script>
</body>
</html>
